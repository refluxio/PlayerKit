name: lgtm-merge
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  lgtm:
    if: github.event.label.name == 'lgtm' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Public repos have allow_auto_merge on; --auto waits for required
        # checks / reviews before merging. Private repos on a free org cannot
        # enable allow_auto_merge (API silently rejects it) and have no branch
        # protection to wait for either, so --auto errors out — fall back to a
        # direct merge there. The lgtm label itself is the human approval.
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto --delete-branch || \
            gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch
