# LGTM auto-merge: applying the `lgtm` label = human review passed. The job
# turns on GitHub auto-merge for the PR; the repository merges it itself once
# branch-protection requirements (e.g. required checks) are satisfied, and the
# head branch is deleted after the merge.
name: lgtm-merge

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  lgtm:
    if: github.event.label.name == 'lgtm' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge ${{ github.event.pull_request.number }} --merge --auto --delete-branch
